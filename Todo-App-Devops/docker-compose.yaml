version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "80:80"  # Expõe a porta 80 do contêiner para a porta 80 do host
    restart: unless-stopped
    depends_on: [backend]  # Garante que o backend esteja rodando antes de subir o frontend
    networks: [todo-net]

  backend:
    build: ./backend
    environment:
      - MONGO_URI=${MONGO_URI}
    restart: unless-stopped
    networks: [todo-net]
    depends_on: [mongo]  # Garante que o MongoDB esteja rodando antes de iniciar o backend

  mongo:
    build: ./banco-de-dados
    container_name: mongo-todo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      -mongo_data:/data/db
    restart: unless-stopped
    networks: [todo-net]

volumes:
  mongo_data:

networks:
  todo-net: